# Local development services. Application processes (web, api, renderer) run on the host with `pnpm dev`.
# Ports are chosen to avoid common local defaults (3000/5432/6379/8000).
name: mapmory-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mapmory
      POSTGRES_PASSWORD: mapmory_dev_password
      POSTGRES_DB: mapmory
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapmory"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: [redisdata:/data]

  # S3-compatible object storage (SeaweedFS, Apache-2.0). Buckets are created by the API on startup in dev.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  martin:
    image: ghcr.io/maplibre/martin:latest
    command: ["--config", "/config/martin.yaml"]
    ports: ["127.0.0.1:3010:3000"]
    volumes:
      - ./martin/martin.yaml:/config/martin.yaml:ro
      - ./data/tiles:/tiles:ro
      - ../packages/fonts/ttf:/fonts:ro

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  redisdata:
  s3data:
