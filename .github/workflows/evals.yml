name: LLM evals

# Manual: runs the interpretation eval set against a provider (spends API credits). Required on prompt changes (ADR 0003).
on:
  workflow_dispatch:
    inputs:
      provider:
        description: heuristic | anthropic | openai-compatible
        default: anthropic

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mapmory/api evals ${{ inputs.provider }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: postgres://unused
          APP_SECRET: ${{ secrets.CI_DUMMY_SECRET || 'ci-dummy-secret-0123456789-0123456789-abcdef' }}
          BETTER_AUTH_SECRET: ci-dummy-secret-0123456789-0123456789-abcdef
          DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          S3_ACCESS_KEY_ID: unused
          S3_SECRET_ACCESS_KEY: unused
      - uses: actions/upload-artifact@v4
        with: { name: eval-results, path: apps/api/evals/results }
