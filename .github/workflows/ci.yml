name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter "./packages/*" --filter @mapmory/api --filter @mapmory/web test

  api-integration:
    name: API integration (Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mapmory/api test:integration

  renderer:
    name: Renderer (export checks, golden renders, parity)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript xvfb libgl1-mesa-dri libegl1 libopengl0 libcurl4 libuv1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mapmory/renderer exec playwright install --with-deps chromium
      - name: Dev tiles (regional extract) + Martin
        run: |
          pnpm setup:tiles
          docker compose -f infra/docker-compose.yml up -d martin
          timeout 60 bash -c 'until curl -sf localhost:3010/catalog; do sleep 1; done'
      - run: pnpm --filter @mapmory/print-page build
      # Goldens are portable: a Linux/Mesa render differs from the macOS/Metal goldens by 0.4 % (< 1 % threshold).
      - run: xvfb-run -a pnpm --filter @mapmory/renderer test
      - run: xvfb-run -a pnpm --filter @mapmory/renderer parity 0.005
      # Informational: headless Chromium's x86-64 software WebGL drops tiles for some label fonts (ADR 0001);
      # results are still posted as annotations. The label-free parity check above stays blocking.
      - run: xvfb-run -a pnpm --filter @mapmory/renderer parity 0.015 --labels
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: renderer-output, path: apps/renderer/test/__output__ }

  e2e:
    name: Web e2e + accessibility (mock API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mapmory/web exec playwright install --with-deps chromium
      - name: Dev tiles + Martin (map tiles for the preview)
        run: |
          pnpm setup:tiles
          docker compose -f infra/docker-compose.yml up -d martin
      - run: pnpm --filter @mapmory/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  e2e-real:
    name: Web e2e against the real stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils xvfb libgl1-mesa-dri libegl1 libopengl0 libcurl4 libuv1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mapmory/web exec playwright install --with-deps chromium
      - name: Environment (generated secrets, no AI, offline geocoder)
        run: |
          cp .env.example .env
          sed -i "s|^APP_SECRET=.*|APP_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^DATA_ENCRYPTION_KEY=.*|DATA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')|" .env
      - name: Services, tiles and database
        run: |
          pnpm setup:tiles
          docker compose -f infra/docker-compose.yml up -d
          timeout 90 bash -c 'until docker compose -f infra/docker-compose.yml exec -T postgres pg_isready -U mapmory; do sleep 2; done'
          pnpm db:migrate
          pnpm --filter @mapmory/print-page build
      - name: API and render worker
        run: |
          (cd apps/api && nohup npx tsx --env-file=../../.env src/server.ts > /tmp/api.log 2>&1 &)
          (cd apps/renderer && nohup xvfb-run -a npx tsx --env-file=../../.env src/worker.ts > /tmp/worker.log 2>&1 &)
          timeout 90 bash -c 'until curl -sf localhost:4000/readyz; do sleep 1; done'
      - run: pnpm --filter @mapmory/web e2e:real
      - if: failure()
        run: tail -n 80 /tmp/api.log /tmp/worker.log

  security:
    name: Secrets, dependencies, SAST
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with: { scan-args: "--lockfile=pnpm-lock.yaml" }
      - uses: semgrep/semgrep-action@v1
        with: { config: "p/typescript p/react p/nodejs p/owasp-top-ten p/secrets" }

  images:
    name: Build, scan and SBOM container images
    runs-on: ubuntu-24.04
    needs: [checks]
    strategy:
      matrix:
        app: [api, web, renderer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: mapmory-${{ matrix.app }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mapmory-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: anchore/sbom-action@v0
        with: { image: "mapmory-${{ matrix.app }}:ci", artifact-name: "sbom-${{ matrix.app }}.spdx.json" }
